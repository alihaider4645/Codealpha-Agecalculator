<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <h1>Age Calculator</h1>
    <p class="subtitle">Enter your date of birth to see your exact age.</p>

    <form id="ageForm" novalidate>
      <div class="field-row">
        <div class="field">
          <label for="day">Day</label>
          <input type="number" id="day" placeholder="DD" min="1" max="31" required>
        </div>
        <div class="field">
          <label for="month">Month</label>
          <input type="number" id="month" placeholder="MM" min="1" max="12" required>
        </div>
        <div class="field">
          <label for="year">Year</label>
          <input type="number" id="year" placeholder="YYYY" min="1900" required>
        </div>
      </div>

      <p id="error" class="error" role="alert" aria-live="polite"></p>

      <button type="submit">Calculate Age</button>
    </form>

    <div id="result" class="result hidden">
      <div class="result-item">
        <span id="years" class="result-number">0</span>
        <span class="result-label">Years</span>
      </div>
      <div class="result-item">
        <span id="months" class="result-number">0</span>
        <span class="result-label">Months</span>
      </div>
      <div class="result-item">
        <span id="days" class="result-number">0</span>
        <span class="result-label">Days</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
